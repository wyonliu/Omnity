[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "maxim-sim"
version = "0.1.0"
description = "Multi-Agent Society Simulator with economics — the first open-source AI civilization engine."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
dependencies = [
    "openai>=1.0",
    "pyyaml>=6.0",
    "click>=8.0",
    "rich>=13.0",
]

[project.scripts]
maxim = "maxim.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/maxim"]
