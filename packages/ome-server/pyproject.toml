[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ome-server"
version = "0.1.0"
description = "Ome App Backend — FastAPI server wrapping the Ome AI twin"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.100",
    "uvicorn[standard]>=0.20",
    "pydantic>=2.0",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "python-dotenv>=1.0",
    "ome",
]

[project.scripts]
ome-server = "ome_server.main:cli"

[tool.setuptools.packages.find]
where = ["src"]
