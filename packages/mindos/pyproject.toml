[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mindos"
version = "0.2.0"
description = "Portable Digital Soul Protocol — your AI knows you, everywhere."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
semantic = [
    "numpy>=1.24",
    "sentence-transformers>=2.2",
]
llm = ["openai>=1.0"]
dev = ["pytest>=7.0"]
all = [
    "pyyaml>=6.0",
    "numpy>=1.24",
    "sentence-transformers>=2.2",
    "openai>=1.0",
]

[project.scripts]
mindos = "mindos.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mindos"]
