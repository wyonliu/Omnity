[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "omnity-mindos"
version = "0.4.1"
description = "Portable Digital Soul Protocol — your AI knows you, everywhere."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
keywords = ["ai", "memory", "identity", "mcp", "agent", "soul", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/wyonliu/Omnity"
Repository = "https://github.com/wyonliu/Omnity/tree/main/packages/mindos"
Issues = "https://github.com/wyonliu/Omnity/issues"

[project.optional-dependencies]
llm = ["openai>=1.0"]
anthropic = ["anthropic>=0.30"]
semantic = ["numpy>=1.24", "sentence-transformers>=2.2"]
dev = ["pytest>=7.0"]
all = ["pyyaml>=6.0", "numpy>=1.24", "sentence-transformers>=2.2", "openai>=1.0", "anthropic>=0.30"]

[project.scripts]
mindos = "mindos.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mindos"]
