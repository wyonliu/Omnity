[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[project]
name = "omnity-soap"
version = "0.1.0"
description = "SOAP — Spatial Omnity Agentic Protocol (spec validation + soap-mcp + soap-view)"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
dependencies = [
  "jsonschema>=4.20.0",
  "referencing>=0.35.0",
]

[project.optional-dependencies]
# Official MCP SDK targets Python 3.10+; core SOAP tooling runs on 3.9.
mcp = ["mcp>=1.2.0; python_version>='3.10'"]
dev = ["pytest>=8.0"]

[project.scripts]
soap-validate = "omnity_soap.cli:main"
soap-explore = "omnity_soap.explore:main"
soap-view = "omnity_soap.viewer_server:main"
soap-mcp = "omnity_soap.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/omnity_soap"]

[tool.hatch.build.targets.wheel.force-include]
"spec/schemas" = "omnity_soap/schemas"
"web/viewer/dist" = "omnity_soap/viewer_static"

# 保证从 sdist 构建 wheel 时仍能解析上述 force-include 源路径
[tool.hatch.build.targets.sdist.force-include]
"spec/schemas" = "spec/schemas"
"web/viewer/dist" = "web/viewer/dist"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
