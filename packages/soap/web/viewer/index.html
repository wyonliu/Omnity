<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>SOAP-View · Omnity</title>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#0f0f1a;--surface:#181828;--surface2:#1e1e38;--accent:#e94560;--accent2:#ff9800;
      --text:#eaeaea;--text2:#8890a4;--border:#2a2a44;--success:#66bb6a;--fail:#ef5350;
      --blue:#42a5f5;--orange:#ffa726;--pink:#ec407a;
      --font:"SF Pro Text","PingFang SC","Noto Sans SC",system-ui,sans-serif;
      --mono:"SF Mono","Fira Code","Noto Sans Mono",monospace;
    }
    html,body{height:100%;overflow:hidden;font-family:var(--font);background:var(--bg);color:var(--text);font-size:13px}

    .bar{display:flex;align-items:center;gap:10px;padding:4px 12px;background:var(--surface);border-bottom:1px solid var(--border);height:36px;flex-shrink:0}
    .bar h1{font-size:15px;font-weight:800;letter-spacing:1px;color:var(--accent);white-space:nowrap}
    .bar .info{color:var(--text2);font-size:11px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .bar select,.bar button{font-size:11px;padding:2px 8px;border-radius:4px;border:1px solid var(--border);background:var(--surface2);color:var(--text);cursor:pointer}
    .bar button:hover{background:var(--accent)}

    .wrap{display:flex;height:calc(100vh - 36px)}
    .map-col{flex:1;min-width:0;display:flex;flex-direction:column}
    #game-container{flex:1;min-height:200px;background:#0d0d1a;position:relative}
    .entity-bar{display:flex;flex-wrap:wrap;gap:3px;padding:3px 8px;background:var(--surface);border-top:1px solid var(--border);max-height:48px;overflow-y:auto}
    .chip{display:inline-flex;align-items:center;gap:3px;padding:1px 7px;border-radius:10px;font-size:10px;color:var(--text2);border:1px solid var(--border);cursor:pointer;white-space:nowrap;transition:.15s}
    .chip:hover{border-color:var(--accent2);color:var(--text)}
    .chip.sel{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
    .chip .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}

    .side{width:340px;flex-shrink:0;display:flex;flex-direction:column;border-left:1px solid var(--border);background:var(--surface)}
    .pnl{display:flex;flex-direction:column;border-bottom:1px solid var(--border)}
    .pnl-h{display:flex;justify-content:space-between;align-items:center;padding:4px 10px;background:var(--surface2);font-size:10px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.5px}
    .pnl-h .badge{background:var(--accent2);color:#000;padding:0 5px;border-radius:8px;font-size:9px;font-weight:800}
    .pnl-b{padding:6px 10px}
    .pnl.grow{flex:1;min-height:0}.pnl.grow .pnl-b{flex:1;overflow-y:auto}

    .qrow{display:flex;gap:4px;margin-bottom:5px}
    .qbtn{flex:1;padding:3px;font-size:11px;border:1px solid var(--border);border-radius:4px;background:var(--bg);color:var(--text2);cursor:pointer;text-align:center;transition:.15s}
    .qbtn:hover{border-color:var(--accent2);color:var(--text);background:var(--surface2)}
    .qbtn.demo{border-color:#00c853;color:#00e676;font-weight:700}
    .qbtn.demo:hover{background:#00c853;color:#000}
    .ev.thought{border-color:#00e676;background:rgba(0,230,118,0.05)}

    .fg{display:grid;grid-template-columns:1fr 1fr;gap:4px}
    .fg.full{grid-template-columns:1fr}
    .fg label{font-size:9px;color:var(--text2);margin-bottom:1px;display:block}
    .fg input,.fg select{font-size:12px;padding:3px 6px;border:1px solid var(--border);border-radius:4px;background:var(--bg);color:var(--text);font-family:var(--mono);width:100%}
    .fg input:disabled{opacity:.35}
    .fg select{cursor:pointer}
    #btnSend{grid-column:1/-1;padding:5px;font-size:12px;font-weight:700;background:var(--accent);color:#fff;border:none;border-radius:5px;cursor:pointer;letter-spacing:.5px;transition:.15s}
    #btnSend:hover{background:#d32f4f}
    .status{font-size:11px;text-align:center;margin-top:2px;min-height:16px}
    .status.ok{color:var(--success)} .status.fail{color:var(--fail)} .status.sending{color:var(--accent2)}
    #actionResult{font-size:10px;font-family:var(--mono);background:var(--bg);color:var(--text2);padding:4px 6px;border-radius:4px;max-height:70px;overflow-y:auto;white-space:pre-wrap;margin-top:3px;display:none}

    #eventLog{font-size:11px;font-family:var(--mono);line-height:1.5}
    .ev{padding:2px 8px;margin:1px 0;border-left:3px solid var(--border);border-radius:0 3px 3px 0;background:rgba(255,255,255,.02)}
    .ev.OBSERVE{border-color:var(--blue)} .ev.NAVIGATE{border-color:var(--orange)} .ev.MANIPULATE{border-color:var(--pink)}
    .ev .ts{color:var(--text2);font-size:10px} .ev .extra{color:var(--text2);margin-left:8px;font-size:10px}
    .log-empty{color:var(--text2);font-style:italic;padding:6px}

    #detailJson{font-size:10px;font-family:var(--mono);background:var(--bg);color:#c9d1d9;padding:6px;border-radius:4px;white-space:pre-wrap;max-height:160px;overflow-y:auto;display:none}
    .detail-empty{color:var(--text2);font-style:italic;font-size:11px}

    @media(max-width:800px){.wrap{flex-direction:column}.side{width:100%;max-height:50vh;border-left:none;border-top:1px solid var(--border)}#game-container{min-height:240px}}
  </style>
</head>
<body>
  <div class="bar">
    <h1>SOAP</h1>
    <span class="info"><span id="sceneTitle"></span> <span id="sceneMeta" style="opacity:.5"></span></span>
    <select id="roleSelect"><option value="">全景</option></select>
    <button id="btnReload">↻</button>
  </div>
  <div class="wrap">
    <div class="map-col">
      <div id="game-container"></div>
      <div class="entity-bar" id="entityBar"></div>
    </div>
    <div class="side">
      <!-- 控制台 -->
      <div class="pnl">
        <div class="pnl-h">Agent 控制台</div>
        <div class="pnl-b">
          <div class="qrow">
            <button class="qbtn" id="qObserve">👁 观察</button>
            <button class="qbtn" id="qSpeak">💬 对话</button>
            <button class="qbtn" id="qAttack">⚔️ 攻击</button>
            <button class="qbtn" id="qNav">🚶 导航</button>
            <button class="qbtn demo" id="qDemo">🤖 巡游</button>
          </div>
          <div class="fg">
            <div><label>Agent ID</label><input id="ctrlAgent" value="test_agent"/></div>
            <div><label>动词</label><select id="ctrlVerb"><option>OBSERVE</option><option>NAVIGATE</option><option>MANIPULATE</option></select></div>
          </div>
          <div class="fg full" style="margin-top:4px">
            <div><label>目标</label><select id="ctrlTarget"></select></div>
          </div>
          <!-- OBSERVE: 无参数 -->
          <div id="paramObserve" style="margin-top:3px;font-size:10px;color:var(--text2)">无需额外参数，直接发送即可</div>
          <!-- NAVIGATE: URI 下拉 -->
          <div id="paramNavigate" class="fg full" style="margin-top:4px;display:none">
            <div><label>目的地 URI（下拉选择）</label><select id="ctrlNavUri"></select></div>
          </div>
          <!-- MANIPULATE: action + message -->
          <div id="paramManipulate" class="fg" style="margin-top:4px;display:none">
            <div><label>action</label><input id="ctrlAction" placeholder="speak / attack_target / scan_qr"/></div>
            <div><label>message / damage</label><input id="ctrlMsg" placeholder="你好 / 50"/></div>
          </div>
          <div class="fg full" style="margin-top:5px">
            <button id="btnSend">▶ 发送动作</button>
          </div>
          <div id="actionStatus" class="status"></div>
          <div id="actionResult"></div>
        </div>
      </div>
      <!-- 事件日志 -->
      <div class="pnl grow">
        <div class="pnl-h">动作日志 <span class="badge" id="eventCount">0</span></div>
        <div class="pnl-b" id="eventLog"><div class="log-empty">等待 Agent 动作…</div></div>
      </div>
      <!-- 实体详情 -->
      <div class="pnl" style="max-height:30%">
        <div class="pnl-h">实体详情 <span id="detailId" style="font-weight:400;opacity:.5"></span></div>
        <div class="pnl-b">
          <pre id="detailJson"></pre>
          <div class="detail-empty" id="detailEmpty">点击地图或条带中的实体查看详情</div>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
