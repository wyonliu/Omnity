version: "3.9"

services:
  ome-server:
    build:
      context: ..
      dockerfile: packages/ome-server/Dockerfile
    container_name: ome-server
    restart: unless-stopped
    env_file: .env
    volumes:
      - ome-data:/root/.ome     # Persistent Ome data (SQLite, memories)
      - ome-souls:/root/.mindos  # Persistent Mindos souls
    expose:
      - "8765"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8765/docs')"]
      interval: 30s
      timeout: 5s
      retries: 3

  nginx:
    image: nginx:alpine
    container_name: ome-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-etc:/etc/letsencrypt:ro
      - certbot-var:/var/lib/letsencrypt
      - certbot-webroot:/var/www/certbot
    depends_on:
      - ome-server

  certbot:
    image: certbot/certbot
    container_name: ome-certbot
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt
      - certbot-webroot:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  ome-data:
  ome-souls:
  certbot-etc:
  certbot-var:
  certbot-webroot:
