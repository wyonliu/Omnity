name: Ome Server CI

on:
  push:
    paths:
      - "packages/ome-server/**"
      - "packages/ome/**"
      - "packages/mindos/**"
      - ".github/workflows/ome-server-ci.yml"
  pull_request:
    paths:
      - "packages/ome-server/**"
      - "packages/ome/**"
      - "packages/mindos/**"
      - ".github/workflows/ome-server-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/ome-server

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install stack
        run: |
          pip install -e ../mindos
          pip install -e ../ome
          pip install -e ".[pg]"
          pip install pytest

      - name: Pytest (SQLite mode)
        run: pytest -q --tb=short

  test-pg:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: ome_test
          POSTGRES_USER: ome
          POSTGRES_PASSWORD: ome
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    defaults:
      run:
        working-directory: packages/ome-server

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pg_trgm extension
        run: |
          PGPASSWORD=ome psql -h localhost -U ome -d ome_test -c "CREATE EXTENSION IF NOT EXISTS pg_trgm"

      - name: Install stack
        run: |
          pip install -e ../mindos
          pip install -e ../ome
          pip install -e ".[pg]"
          pip install pytest

      - name: Pytest (PG mode — full suite incl. RLS tests)
        env:
          DATABASE_URL: postgresql://ome:ome@localhost:5432/ome_test
        run: pytest -v --tb=short
